{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-title"><div class="title_left"><h3>{{ title }}</h3></div></div>
<div class="clearfix"></div>
<div class="x_panel">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
      </div>
    {% endfor %}
    <button class="btn btn-success" type="submit">Guardar</button>
    <a class="btn btn-default" href="{% url 'accounts:role_list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
