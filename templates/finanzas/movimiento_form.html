{% extends "base.html" %}
{% block title %}Nuevo movimiento{% endblock %}
{% block content %}
<div class="x_panel">
  <div class="x_title"><h2>Nuevo movimiento</h2><div class="clearfix"></div></div>
  <form method="post">{% csrf_token %}
    <div class="form-group">
      <label>Fecha</label>
      <input type="date" name="fecha" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Cuenta bancaria</label>
      <select name="cuenta_bancaria" class="form-control">
        <option value="">— (usar texto libre)</option>
        {% for c in cuentas %}
          <option value="{{ c.pk }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Cuenta (texto)</label>
      <input type="text" name="cuenta" class="form-control" value="principal" placeholder="Si eliges cuenta bancaria, se usa su nombre">
    </div>
    <div class="form-group">
      <label>Tipo</label>
      <select name="tipo" class="form-control" required>
        <option value="cargo">Cargo</option>
        <option value="abono">Abono</option>
      </select>
    </div>
    <div class="form-group">
      <label>Monto</label>
      <input type="number" name="monto" class="form-control" step="0.01" min="0" required>
    </div>
    <div class="form-group">
      <label>Factura / boleta</label>
      <select name="factura" class="form-control">
        <option value="">—</option>
        {% for f in facturas %}
          <option value="{{ f.pk }}">{{ f }} — {{ f.proyecto }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <input type="text" name="descripcion" class="form-control">
    </div>
    <div class="form-group">
      <label>Referencia</label>
      <input type="text" name="referencia" class="form-control">
    </div>
    <button class="btn btn-success" type="submit">Guardar</button>
    <a class="btn btn-default" href="{% url 'finanzas:movimientos_list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
