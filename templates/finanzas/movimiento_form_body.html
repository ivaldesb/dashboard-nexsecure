<div class="form-group">
  <label for="id_fecha">Fecha</label>
  <input type="date" name="fecha" id="id_fecha" class="form-control" required>
</div>
<div class="form-group">
  <label for="id_cuenta_bancaria">Cuenta bancaria</label>
  <select name="cuenta_bancaria" id="id_cuenta_bancaria" class="form-control">
    <option value="">— (usar texto libre)</option>
    {% for c in cuentas %}
      <option value="{{ c.pk }}">{{ c }}</option>
    {% endfor %}
  </select>
</div>
<div class="form-group">
  <label for="id_cuenta">Cuenta (texto)</label>
  <input type="text" name="cuenta" id="id_cuenta" class="form-control" value="principal" placeholder="Si eliges cuenta bancaria, se usa su nombre">
</div>
<div class="form-group">
  <label for="id_tipo">Tipo</label>
  <select name="tipo" id="id_tipo" class="form-control" required>
    <option value="cargo">Cargo</option>
    <option value="abono">Abono</option>
  </select>
</div>
<div class="form-group">
  <label for="id_monto">Monto</label>
  <input type="number" name="monto" id="id_monto" class="form-control" step="0.01" min="0" required>
</div>
<div class="form-group">
  <label for="id_factura">Factura / boleta</label>
  <select name="factura" id="id_factura" class="form-control">
    <option value="">—</option>
    {% for f in facturas %}
      <option value="{{ f.pk }}">{{ f }} — {{ f.proyecto }}</option>
    {% endfor %}
  </select>
</div>
<div class="form-group">
  <label for="id_descripcion">Descripción</label>
  <input type="text" name="descripcion" id="id_descripcion" class="form-control">
</div>
<div class="form-group">
  <label for="id_referencia">Referencia</label>
  <input type="text" name="referencia" id="id_referencia" class="form-control">
</div>
